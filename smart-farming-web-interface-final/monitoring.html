<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoring - Smart Farming</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- =====================================================
         SIDEBAR
         ===================================================== -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <div class="logo-icon">
                    <i class="fa-solid fa-leaf"></i>
                </div>

                <div>
                    <h2>Smart Farming</h2>
                    <span>Monitoring System</span>
                </div>

            </div>


            <nav class="sidebar-menu">

                <a href="index.html" class="menu-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>

                <a href="monitoring.html" class="menu-item active">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Monitoring</span>
                </a>

                <a href="cnn.html" class="menu-item">
                    <i class="fa-solid fa-camera"></i>
                    <span>CNN</span>
                </a>

                <a href="lstm.html" class="menu-item">
                    <i class="fa-solid fa-brain"></i>
                    <span>LSTM</span>
                </a>
<a href="history.html" class="menu-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>History</span>
                </a>

                <a href="setting.html" class="menu-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Pengaturan</span>
                </a>

            </nav>


            <div class="sidebar-footer">

                <div class="system-status">

                    <span class="status-dot"></span>

                    <span>Sistem Aktif</span>

                </div>

            </div>

        </aside>


        <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

        <main class="main-content">


            <!-- HEADER -->

            <header class="top-header">

                <div>

                    <h1>Monitoring</h1>

                    <p>
                        Pemantauan kondisi lingkungan tanaman secara real-time
                    </p>

                </div>

                <div class="header-date">

                    <i class="fa-regular fa-calendar"></i>

                    <span id="currentDate">
                        --
                    </span>

                </div>

            </header>



            <!-- =================================================
             SENSOR
             ================================================= -->

            <section class="monitor-sensor-grid">


                <!-- SUHU -->

                <div class="monitor-sensor-card">

                    <div class="monitor-sensor-icon temperature">

                        <i class="fa-solid fa-temperature-half"></i>

                    </div>

                    <div>

                        <span>
                            SUHU UDARA
                        </span>

                        <strong>
                            <span id="temperature">--</span>
                            °C
                        </strong>

                    </div>

                </div>


                <!-- KELEMBAPAN UDARA -->

                <div class="monitor-sensor-card">

                    <div class="monitor-sensor-icon humidity">

                        <i class="fa-solid fa-cloud"></i>

                    </div>

                    <div>

                        <span>
                            KELEMBAPAN UDARA
                        </span>

                        <strong>
                            <span id="humidity">--</span>
                            %
                        </strong>

                    </div>

                </div>


                <!-- KELEMBAPAN TANAH -->

                <div class="monitor-sensor-card">

                    <div class="monitor-sensor-icon soil">

                        <i class="fa-solid fa-seedling"></i>

                    </div>

                    <div>

                        <span>
                            KELEMBAPAN TANAH
                        </span>

                        <strong>
                            <span id="soil">--</span>
                            %
                        </strong>

                    </div>

                </div>

            </section>



            <!-- =================================================
             GRAFIK REAL-TIME
             ================================================= -->

            <section class="monitor-chart-grid">
                <!-- GRAFIK REAL -->

                <div class="monitor-panel">

                    <div class="monitor-panel-header">

                        <div>

                            <h2>
                                Data Real-Time
                            </h2>

                            <p>
                                Data sensor dari sistem
                            </p>

                        </div>

                        <span class="live-badge">

                            <span></span>

                            LIVE

                        </span>

                    </div>


                    <div class="chart-container">

                        <canvas id="realtimeChart"></canvas>

                    </div>

                </div>


            </section>


            <!-- UPDATE -->

            <div class="monitor-last-update">

                <i class="fa-regular fa-clock"></i>

                Terakhir diperbarui:

                <span id="lastUpdate">
                    --
                </span>

            </div>


        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script src="javascript/monitoring.js"></script>

</body>

</html>
